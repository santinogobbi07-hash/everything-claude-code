name: Deploy GameRank to GitHub Pages

on:
  push:
    branches:
      - claude/gamerank-app-mynzd
    paths:
      - 'gamerank/**'
      - '.github/workflows/deploy-gamerank.yml'
  workflow_dispatch:

# Plain "contents: write" so we can push to the gh-pages branch via git.
# This avoids the github-pages environment and its branch protection rules.
permissions:
  contents: write

concurrency:
  group: gamerank-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gamerank/package-lock.json

      - name: Install dependencies
        working-directory: gamerank
        run: npm ci

      - name: Build
        working-directory: gamerank
        env:
          VITE_BASE: /everything-claude-code/
        run: npm run build

      - name: SPA fallback for GitHub Pages
        working-directory: gamerank
        run: cp dist/index.html dist/404.html

      - name: Disable Jekyll processing
        working-directory: gamerank
        run: touch dist/.nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gamerank/dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'deploy: gamerank build from ${{ github.sha }}'
